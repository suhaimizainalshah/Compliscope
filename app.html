<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compliscope</title>
<link rel="icon" href="icons/icon32.png">
<style>
:root{--bg:#f4f6f9;--panel:#fff;--soft:#eef2f6;--ink:#101828;--muted:#5b6577;--line:#e3e8ef;--accent:#0f766e;--accent2:#14b8a6;--fail:#dc2626;--warn:#d97706;--pass:#16a34a;--info:#2563eb;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--panel:#171c23;--soft:#1f2630;--ink:#eef2f6;--muted:#9aa5b5;--line:#2a323d;--accent:#2dd4bf;--accent2:#5eead4;--fail:#f87171;--warn:#fbbf24;--pass:#4ade80;--info:#60a5fa;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;color:inherit;text-decoration:none}.brand img{width:28px;height:28px}
nav.tabs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--soft);overflow-x:auto}
nav.tabs a{padding:7px 14px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:650;font-size:14px;white-space:nowrap}
nav.tabs a[aria-current=page]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.spacer{flex:1}
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 60px}
h1{font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-.025em;line-height:1.15;margin:0}
h2{font-size:1.2rem;letter-spacing:-.01em;margin:0}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:650;font-size:14px;text-decoration:none;color:inherit}
.btn:hover{background:var(--soft)}.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
.grade{width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:46px;line-height:1}
.grade small{display:block;font-size:12px;font-weight:700;opacity:.9;text-align:center;margin-top:-6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.sum .card{padding:14px 16px;display:grid;gap:6px}
.sum h3{margin:0;font-size:14px;display:flex;justify-content:space-between}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft)}
.pill i{width:8px;height:8px;border-radius:50%}
.fail{color:var(--fail)}.warn{color:var(--warn)}.pass{color:var(--pass)}.info{color:var(--info)}
.bgfail{background:var(--fail)}.bgwarn{background:var(--warn)}.bgpass{background:var(--pass)}.bginfo{background:var(--info)}
.lawbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.lawchip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:650}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:650;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.find{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.find>summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.find>summary::-webkit-details-marker{display:none}
.st{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px}
.find h3{margin:0;font-size:15px}.find .sub{font-size:12.5px;color:var(--muted)}
.sev{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--soft)}
.fb{padding:0 16px 16px 58px;display:grid;gap:12px}
.fb h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fb ul{margin:0;padding-left:18px}.fb li{margin:2px 0;overflow-wrap:anywhere}
.refs{display:grid;gap:8px}
.ref{border-left:3px solid var(--accent);padding:6px 10px;background:var(--soft);border-radius:0 8px 8px 0}
.ref b{font-size:13px}.ref ul{font-size:13.5px}
.vf{font-size:11.5px;font-weight:700;color:var(--warn)}
.disc{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lawcard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer}
.lawcard:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.lawcard input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px}
.lawcard b{display:block}.lawcard small{color:var(--muted);display:block}
.hist{display:grid;gap:8px}.hist a{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;color:inherit}
.g{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:900}
.nav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:start}
.q{display:grid;gap:14px}
.q fieldset{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);margin:0}
.q legend{font-weight:800;padding:0 6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13.5px;background:var(--panel)}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel));font-weight:650}
.opt input{accent-color:var(--accent)}
.q input[type=text]{width:100%;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.out{position:sticky;top:76px;display:grid;gap:14px;max-height:calc(100vh - 96px);overflow:auto;padding-right:4px}
.cls{display:grid;gap:8px}
.ai{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel)}
.ai .cat{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.todo{display:grid;gap:8px}.todo label{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer}
.todo input{width:18px;height:18px;accent-color:var(--accent);margin-top:2px}.todo small{display:block;color:var(--muted);font-size:12.5px}
.tpl{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}.tpl summary{padding:10px 12px;cursor:pointer;font-weight:700}.tpl pre{margin:0;padding:12px;border-top:1px solid var(--line);white-space:pre-wrap;font:13px/1.55 ui-monospace,monospace;background:var(--soft)}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cmp th,.cmp td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{background:var(--soft);font-size:12.5px;position:sticky;top:0}
.cmp td:first-child{font-weight:700;white-space:nowrap}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.03em;white-space:nowrap}
.b-binding{background:color-mix(in srgb,var(--fail) 14%,var(--panel));color:var(--fail)}.b-draft{background:color-mix(in srgb,var(--warn) 16%,var(--panel));color:var(--warn)}
.b-guidance{background:color-mix(in srgb,var(--info) 14%,var(--panel));color:var(--info)}.b-patchwork{background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--accent)}
.country{border:1px solid var(--line);border-radius:16px;background:var(--panel);margin-bottom:12px;overflow:hidden}
.country>summary{list-style:none;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer}
.country>summary::-webkit-details-marker{display:none}
.country h3{margin:0;font-size:1.05rem}.cbody{padding:0 18px 18px;display:grid;gap:14px}
.inst{display:grid;gap:8px}.inst div{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 12px;border-radius:10px;background:var(--soft)}
.inst b{font-size:14px}.inst small{grid-column:2;color:var(--muted);font-size:13.5px}
.typ{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:6px;align-self:start;white-space:nowrap}
.t-Binding{background:var(--fail);color:#fff}.t-Voluntary{background:var(--info);color:#fff}.t-Draft{background:var(--warn);color:#fff}.t-Policy{background:#64748b;color:#fff}
.tl{display:grid;gap:4px;border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl div{font-size:13.5px}.tl b{display:inline-block;min-width:92px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);opacity:0;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--panel);font-weight:650;transition:.18s;pointer-events:none;z-index:9}.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:50px 20px}
.welcome{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
@media (max-width:860px){.hero{grid-template-columns:auto 1fr}.actions{grid-column:1/-1;justify-content:flex-start}.sum,.grid2,.nav,.steps,.welcome{grid-template-columns:1fr}.out{position:static;max-height:none}}
@media print{.top,.actions,.filters,.noprint{display:none!important}body{background:#fff}.card,.find{break-inside:avoid;border-color:#ccc}.find:not([open])>.fb{display:grid}.find>.fb{display:grid!important}.wrap{padding:0}.out{position:static;max-height:none;overflow:visible}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#history"><img src="icons/icon48.png" alt="">Compliscope</a>
  <nav class="tabs" aria-label="Sections"><a href="#audit" data-v="audit">Site audit</a><a href="#navigator" data-v="navigator">Readiness navigator</a><a href="#atlas" data-v="atlas">AI and data atlas</a><a href="#laws" data-v="laws">Laws</a><a href="#history" data-v="history">History</a></nav>
  <span class="spacer"></span>
</header>
<main class="wrap" id="view"></main>
<footer class="wrap"><p class="muted" style="font-size:13px;padding:0 0 24px"><a href="privacy.html">Privacy policy</a> · <a href="https://suhaimizainalshah.github.io/Compliscope-Advisory/" target="_blank" rel="noopener">Compliscope Advisory</a> — independent AI compliance and governance support · Compliscope runs on your device and sends nothing anywhere except the site being audited.</p></footer>
<div class="toast" id="toast" role="status"></div>
<script src="laws.js"></script><script src="atlas.js"></script><script src="rules.js"></script><script src="navigator.js"></script><script src="app.js"></script>
</body>
</html>
